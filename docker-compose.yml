services:
  reservation-service:
    build:
      context: ./servicio-reservas
    environment:
      PACT_TEST_MODE: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/docs", timeout=2)
      interval: 2s
      timeout: 3s
      retries: 15

  user-portal:
    build:
      context: ./user-portal
    environment:
      RESERVATION_SERVICE_URL: http://reservation-service:8000
    depends_on:
      reservation-service:
        condition: service_healthy
    ports:
      - "3000:3000"

  administration-service:
    build:
      context: ./administration-service
    environment:
      RESERVATION_SERVICE_URL: http://reservation-service:8000
    depends_on:
      reservation-service:
        condition: service_healthy
    ports:
      - "8080:8080"
